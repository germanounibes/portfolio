<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link rel="shortcut icon" href="imagens/contato.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contatos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="contato.css">
</head>

<body>
    <header id="navega" onclick="toggleNavega()" class="NavegaSide glass">
        <img src="imagens/pfp.jpg" alt="Profile Pic" class="logo">
        <h1 style="color: rgba(255, 255, 255, 0.8); text-shadow: 1px 1px 10px rgba(0, 0, 0, 0.5); font-size: 2rem;">
            Portfólio
            e Currículo</h1>

        <h2 style="margin: 1%; color: rgba(0, 0, 0, 0.7);">João Pedro da silva Germano</h2>
        <a class="glass botaonav" href="index.html">Currículo</a>
        <a class="glass botaonav" href="portfolio.html">Portfólio</a>
        <a class="glass botaonav" href="contato.html">Contatos</a>
    </header>
    <center>
        <h1 id="relogio">00:00:00</h1>
    </center>

    <div>

        <fieldset>
            <legend>indentificação do usuario</legend>

            <p>
                <label for="nome">Nome:</label>
                <input type="text" id="cnome" name="nome" size="50px" placeholder="digite seu nome" requered
                    autocomplete="on" autofocus>
            </p>

            <p>
                <label for="password" name="password">senha:</label>
                <input type="password" size="40" id="40px" name="senha" id="csenha" placeholder="digite sua senha"
                    requered autocomplete="on" autofocus maxlength="8" minlength="4">
            </p>

            <p>
                <label for="email">E-mail:</label>
                <input type="email" id="cemail" name="email" size="50px" placeholder="digite seu e-mail" requered
                    autocomplete="on" autofocus>
            </p>

            <fieldset>
                <legend>sexo</legend>
                <p>
                    <input type="radio" name="sexo" id="cm" value="masculino">
                    <label for="cm">masculino</label>
                </p>

                <p>
                    <input type="radio" name="sexo" id="cf" value="feminino">
                    <label for="cf">feminino</label>
                </p>

                <p>
                    <input type="radio" name="sexo" id="co" value="outro">
                    <label for="co">outro</label>
                </p>
            </fieldset>

            <p>
                <label for="data">Data de Nascimento:</label>
                <input type="date" name="data" id="cdata" requered autocomplete="on">
            </p>

        </fieldset>
        <fieldset>
            <legend>endereço do usuario</legend>

            <p>
                <label for="">logadouro</label>
                <input type="text" id="cend" name="endereço" size="30px" placeholder="digite seu endereço" requered
                    autocomplete="on" autofocus>
            </p>

            <p>
                <label for="num">numero</label>
                <input type="number" name="num" id="cnum" min="1" max="999" value="1" autofocus requered
                    autocomplete="on">
            </p>
        </fieldset>
    </div>

    <footer>
        ©Portfólio - 2026 João Germano💻
    </footer>
    <footer>
        <a target="_blank" href="https://www.instagram.com/joaogermano5/"><img src="icons/instagram.png" alt="Instagram"
                class="footerimg"></a>
        <a target="_blank" href="https://github.com/GermanJoao"><img src="icons/github.png" alt="Github"
                class="footerimg"></a>
        <a target="_blank" href="https://www.linkedin.com/in/GermanoJoao/"><img src="icons/linkedin.png" alt="Linkedin"
                class="footerimg"></a>
        <a target="_blank" href="https://portfolio-germano.vercel.app"><img src="icons/portfolio.png" alt="Portfolio"
                class="footerimg"></a>
    </footer>
    <script src="script.js"></script>
</body>

</html>
